name: repository-audit

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]" --no-build-isolation
      - run: python -m compileall -q src enumerate tools tests
      - run: python -m pytest -q
      - run: python tools/check_repository.py
      - run: python tools/check_generated_artifacts.py
      - run: >-
          python enumerate/q0015_configuration_auditor.py
          --regressions-only
          --generated-at 2026-07-28T00:00:00Z
          --output-dir artifacts/runs/q0015
