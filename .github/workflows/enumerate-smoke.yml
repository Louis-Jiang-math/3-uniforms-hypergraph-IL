name: enumerate-smoke

on:
  push:
    paths:
      - "enumerate/**"
      - "requirements.txt"
      - ".github/workflows/enumerate-smoke.yml"
  pull_request:
    paths:
      - "enumerate/**"
      - "requirements.txt"
      - ".github/workflows/enumerate-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile enumerate/q0015_configuration_auditor.py
      - run: python enumerate/q0015_configuration_auditor.py --help
