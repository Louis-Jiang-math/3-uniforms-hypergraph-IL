accepted_latest_progress:
  - id: R-SWITCH-SLOT-01
    status: proved-formal-supporting
    statement: >
      In a finite unique-blocker all-release actual core, a fixed output edge f
      can arise from at most one switch slot of a fixed input edge e, uniformly
      over all completion contexts. Perfect-transition cycles have trivial
      monodromy and decompose into completion sheets.
    nonclaim: "This does not prove the switch-cube defect or close Q-0016."
  - id: R-ROOT-EXCESS-01
    status: proved-formal-supporting
    statement: >
      On a finite legal interval, original two-step root failures admit one
      no-copy canonical actual-edge load and one root-only capacity ledger,
      yielding the exact bound degree term plus Xi_I.
    nonclaim: "Xi_I is not yet controlled, and the capacity does not refresh on descendants."
  - id: R-ROUND-CORE-01
    status: proved-conditional-supporting
    statement: >
      On an exact finitely branching execution tree with a no-copy first-owner
      partition, complete actual candidate-edge sets, and separately verified
      root/slot budgets, the dynamic actual-edge network has an exact
      max-flow/min-cut formula and every flow has a pathwise actual realization.
      Stable finite future completion gives Round / named exit / R / actual
      multi-edge core; nonstabilization remains explicit overflow.
    nonclaim: >
      This does not construct the execution tree from every target instance,
      convert overflow, classify actual cores, or prove the one-quarter theorem.
  - id: R-Q0015-AGG-01
    status: proved-formal-supporting
    statement: >
      Actual two-step failure mass has an exact normalized aggregate-cylinder
      decomposition. Pair-flat mass is paid by one Delta(H); all remaining mass
      is the explicit heavy-pair positive excess.
    nonclaim: "The heavy-pair excess is not known to be small."
  - id: R-Q0015-RESET-01
    status: proved-formal-supporting
    statement: >
      Under a future-compatible orientation congruence, every resource-free
      reset consumes a new orientation token or repeats a sound quotient token.
    nonclaim: "The exact token space may be too large for a charging proof."
  - id: R-FCL-01
    status: proved-formal-supporting
    statement: >
      A Q-0015 actual root obstacle either produces a finite named exit or has a
      mass- and ledger-preserving future-complete lift containing a genuine
      persistent-blocker branch.
    nonclaim: "It does not construct a general entrance or prove global stability."
  - id: R-AMCG-01
    status: definition
    statement: >
      AMCG is an auditable fractional mass-conserving genealogy specification.
      It is not known to arise near-losslessly from every target instance.
  - id: R-HALL-ORTH-01
    status: proved-formal-supporting
    statement: >
      Local blocker max-flow gives an exact Hall-deficiency orthogonalization,
      and the Hall deficiency is bounded by the earlier positive heavy-excess
      quantity.
  - id: R-EXCHANGE-01
    status: proved-formal-supporting
    statement: >
      For a fixed local maximum assignment, the simplified alternating exchange
      network exactly reconstructs chargeable residual assignments with the same
      blocker-load vector.
  - id: R-Q4-SPLICE-01
    status: observed-bounded-exhaustive
    statement: >
      In all eight normal Q4 matching models, 768 future-complete release
      policies split as 384 edge-disjoint splice candidates, 192 unavoidable
      real-edge-reuse policies, and 192 local same-pivot policies.
    nonclaim: "This is not a general splice/reuse/cylinder theorem."
  - id: R-Q4-SPLICE-02
    status: observed-bounded-exhaustive
    statement: >
      Every edge-disjoint splice candidate in the normal Q4 models uses all
      eight real edges.
    nonclaim: "Splice is therefore not licensed as a free global operation."
  - id: R-ATLAS-LP-01
    status: proved-formal-supporting
    statement: >
      Finite future signatures either stabilize to a faithful quotient or remain
      explicit as overflow; on any finite faithful quotient, certified W/M/A/N
      modules plus actual blocker-edge history give an exact potential-or-residual-core
      interface.
    nonclaim: "This does not construct a global atlas from every target instance or classify residual cores."
  - id: R-M-FAN-01
    status: proved-formal-supporting
    statement: >
      Competing blockers have at most one legal release. Live events form real
      pair-fiber fans, and under rectangular support wide-fan mass satisfies the
      product-tail/heavy-pair bound of F-0050.
    nonclaim: "A single heavy pair is not a one-quarter terminal exit."
  - id: R-PRODUCT-LEDGER-01
    status: proved-conditional-supporting
    statement: >
      In a clean finite product chart, the exact critical deficit is paid by
      actual SCC-rank progress and disjoint first leaves or structural exits.
    nonclaim: "The chart hypotheses and global resource multiplicities remain to be proved."
